<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --primary: #6B5CF6; --secondary: #A855F7; --bg: #0B0914; --surface: #2A243C;
      --text: #E5E7EB; --accent: #C4B5FD; --muted: #9a93b3;
      --grad: linear-gradient(135deg, var(--primary), var(--secondary));
    }
    body {
      width: 280px; margin: 0; padding: 18px;
      font-family: Poppins, Inter, system-ui, sans-serif;
      background: linear-gradient(150deg, #1a1430 0%, var(--bg) 55%, #241a45 100%); color: var(--text);
    }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .head img { width: 40px; height: 40px; }
    h1 { font-size: 18px; font-weight: 700; margin: 0; color: #fff; letter-spacing: -.3px; }
    h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tag { margin: 0; font-size: 11px; font-style: italic; color: var(--accent); }
    p { font-size: 12px; color: var(--muted); margin: 0 0 14px; line-height: 1.45; }
    button {
      width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--grad);
      color: #fff; font: 600 13px Poppins, Inter, system-ui, sans-serif; cursor: pointer;
      box-shadow: 0 6px 18px rgba(107,92,246,.4);
    }
    button:hover { filter: brightness(1.12); }
  </style>
</head>
<body>
  <div class="head">
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>Chat<span>Happens</span></h1>
      <p class="tag">Chat happens. Move on.</p>
    </div>
  </div>
  <p id="msg" data-i18n="popupMsg"></p>
  <button id="go" data-i18n="popupOpen"></button>
  <script src="popup.js"></script>
</body>
</html>
